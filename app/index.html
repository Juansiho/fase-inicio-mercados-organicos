<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MatchPoint - Prototipo Sprint 2</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#1f2937;background:#f5f6f8;line-height:1.5}
header{background:#1f2937;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:20px}header span{font-size:14px;color:#cbd5e1}
main{max-width:980px;margin:0 auto;padding:20px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav button{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:7px 16px;cursor:pointer;font-size:14px}
nav button.on{background:#1971c2;color:#fff;border-color:#1971c2}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:18px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:20px}h3{margin:0 0 8px;font-size:16px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font:inherit}
button.p{background:#1971c2;color:#fff;border:0;border-radius:6px;padding:9px 18px;font-weight:600;cursor:pointer;margin-top:14px}
button.p:disabled{opacity:.5;cursor:default}
button.s{background:#fff;border:1px solid #cbd5e1;border-radius:6px;padding:6px 12px;cursor:pointer}
.msg{padding:9px 12px;border-radius:6px;margin:12px 0 0;font-size:14px}
.ok{background:#e3f4e5;color:#1e6b2a}.err{background:#ffe3e3;color:#a61e1e}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #e5e7eb;padding:8px 10px;text-align:left}th{background:#f1f3f5}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;color:#fff}
.b-open{background:#2e7d32}.b-closed{background:#6b7280}
.saldo{font-size:38px;font-weight:700;color:#1971c2}
.note{font-size:13px;color:#6b7280}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b>MatchPoint</b><span id="who"></span></header>
<main id="app"></main>

<script>
/* =====================================================================
   MatchPoint - prototipo del Sprint 2 (HU01 a HU09).
   Los datos se guardan en el navegador (localStorage).
   Administrador de prueba -> identificación: admin   contraseña: admin123
   Responsables de cada HU:
     Thomas: HU01 Registro, HU02 Inicio de sesión, HU09 Permisos por rol
     Juan:   HU03 Crear torneo, HU04 Registrar evento, HU07 Asignar créditos
     Miguel: HU05 Consultar torneos, HU06 Ver eventos, HU08 Consultar saldo
   ===================================================================== */
const KEY = 'matchpoint_db_v1';
const SESSION_MIN = 15;            // la sesión expira tras 15 min de inactividad
let mem = null;                    // respaldo si el navegador bloquea localStorage

function readDB() {
  try { const t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch (e) {}
  return mem;
}
function saveDB() {
  mem = db;
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {}
}
async function sha(text) {
  if (window.crypto && crypto.subtle) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const c of text) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'h' + h;
}
let db = readDB();
let session = null;

/* ---------------- HU09 (Thomas): permisos por rol -------------------- */
const A = 'Administrador', U = 'Usuario';
const PERMISOS = {
  crearTorneo: [A], registrarEvento: [A], asignarCreditos: [A], listarUsuarios: [A],
  verTorneos: [A, U], verEventos: [A, U], verSaldo: [A, U]
};
function guard(accion) {                       // se valida en la lógica, no solo en los botones
  if (!session) throw new Error('Debes iniciar sesión.');
  if (!PERMISOS[accion] || !PERMISOS[accion].includes(session.rol))
    throw new Error('Acceso denegado: tu rol (' + session.rol + ') no puede realizar esta acción.');
}

/* ---------------- HU01 (Thomas): registro de usuario ----------------- */
async function registrar(nombre, ident, correo, pass) {
  nombre = nombre.trim(); ident = ident.trim(); correo = correo.trim();
  if (!nombre || !ident || !correo || !pass) throw new Error('Todos los campos son obligatorios.');
  if (!/^\S+@\S+\.\S+$/.test(correo)) throw new Error('El correo no tiene un formato válido.');
  if (pass.length < 6) throw new Error('La contraseña debe tener al menos 6 caracteres.');
  if (db.usuarios.some(u => u.identificacion === ident))        // evita duplicados y reenvíos
    throw new Error('Ya existe un usuario con esa identificación.');
  db.usuarios.push({ id: db.sig.usuario++, nombre, identificacion: ident, correo,
                     pass: await sha(pass), rol: U });           // la contraseña se guarda cifrada
  saveDB();
}

/* ---------------- HU02 (Thomas): inicio de sesión -------------------- */
async function login(ident, pass) {
  const u = db.usuarios.find(x => x.identificacion === ident.trim());
  if (!u || u.pass !== await sha(pass))
    throw new Error('Identificación o contraseña incorrectas.');   // mensaje genérico
  session = { id: u.id, nombre: u.nombre, rol: u.rol, t: Date.now() };
  sessionStorageSafe(true);
}
function sessionStorageSafe(set) {
  try {
    if (set) sessionStorage.setItem('mp_s', JSON.stringify(session));
    else if (set === false) sessionStorage.removeItem('mp_s');
    else { const s = JSON.parse(sessionStorage.getItem('mp_s')); return s; }
  } catch (e) {}
}
function restoreSession() {
  const s = sessionStorageSafe();
  if (s && Date.now() - s.t < SESSION_MIN * 60000) { session = s; session.t = Date.now(); sessionStorageSafe(true); }
  else { session = null; sessionStorageSafe(false); }
}
function logout() { session = null; sessionStorageSafe(false); render(); }

/* ---------------- HU03 (Juan): crear torneo -------------------------- */
function crearTorneo(nombre, deporte, inicio, fin) {
  guard('crearTorneo');
  nombre = nombre.trim(); deporte = deporte.trim();
  if (!nombre || !deporte || !inicio || !fin) throw new Error('Nombre, deporte y fechas son obligatorios.');
  if (fin < inicio) throw new Error('La fecha de fin no puede ser anterior a la de inicio.');
  if (db.torneos.some(t => t.nombre.toLowerCase() === nombre.toLowerCase() && t.inicio === inicio && t.fin === fin))
    throw new Error('Ya existe un torneo con ese nombre y esas fechas.');
  db.torneos.push({ id: db.sig.torneo++, nombre, deporte, inicio, fin, estado: 'Activo' });
  saveDB();
}

/* ---------------- HU04 (Juan): registrar evento ---------------------- */
function registrarEvento(torneoId, nombre, inicio, cierre, modalidad, participantes) {
  guard('registrarEvento');
  const t = db.torneos.find(x => x.id === Number(torneoId));
  if (!t) throw new Error('El torneo seleccionado no existe.');
  if (!nombre.trim() || !inicio || !cierre) throw new Error('Nombre, inicio y cierre de pronósticos son obligatorios.');
  if (cierre > inicio) throw new Error('El cierre de pronósticos debe ser anterior o igual al inicio del evento.');
  let opciones;
  if (modalidad === 'resultado') opciones = ['Local', 'Empate', 'Visitante'];
  else {
    opciones = participantes.split('\n').map(s => s.trim()).filter(Boolean);
    if (opciones.length < 2) throw new Error('La modalidad "ganador" necesita al menos 2 participantes (uno por línea).');
  }
  db.eventos.push({ id: db.sig.evento++, torneoId: t.id, nombre: nombre.trim(), inicio, cierre,
                    modalidad, opciones, estado: 'Programado' });
  saveDB();
}

/* ---------------- HU05 (Miguel): consultar torneos ------------------- */
function torneosActivos() {
  guard('verTorneos');
  return db.torneos.filter(t => t.estado === 'Activo').sort((a, b) => a.inicio.localeCompare(b.inicio));
}

/* ---------------- HU06 (Miguel): eventos, fechas y estado ------------ */
function estadoEvento(ev) { return new Date(ev.cierre) > new Date() ? 'Programado' : 'Cerrado'; }
function eventosDe(torneoId) {
  guard('verEventos');
  return db.eventos.filter(e => e.torneoId === Number(torneoId)).sort((a, b) => a.inicio.localeCompare(b.inicio));
}

/* ---------------- HU07 (Juan): asignar créditos iniciales ------------ */
function asignarCreditos(userId, cantidad, requestId) {
  guard('asignarCreditos');
  const n = Number(cantidad);
  if (!Number.isInteger(n) || n <= 0) throw new Error('La cantidad debe ser un número entero mayor que cero.');
  const u = db.usuarios.find(x => x.id === Number(userId));
  if (!u) throw new Error('Selecciona un usuario.');
  if (db.requests.includes(requestId))                          // solicitud repetida: no duplica
    throw new Error('Esta asignación ya fue registrada (solicitud repetida ignorada).');
  db.requests.push(requestId);
  db.movimientos.push({ id: db.sig.mov++, usuarioId: u.id, tipo: 'Asignación', cantidad: n,
                        fecha: new Date().toISOString(), responsable: session.nombre });
  saveDB();
}

/* ---------------- HU08 (Miguel): consultar mi saldo ------------------ */
function saldoDe(userId) { return db.movimientos.filter(m => m.usuarioId === userId).reduce((s, m) => s + m.cantidad, 0); }
function miSaldo() { guard('verSaldo'); return saldoDe(session.id); }      // solo el propio saldo
function misMovimientos() { guard('verSaldo'); return db.movimientos.filter(m => m.usuarioId === session.id); }

/* =========================== Interfaz ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' }) : '';
let tab = null, torneoSel = null, flash = null, authMode = 'login';
const nuevoRequestId = () => 'r' + Date.now() + Math.random().toString(16).slice(2);
let requestId = nuevoRequestId();

function msg(kind, text) { flash = { kind, text }; }
function showFlash() { if (!flash) return ''; const f = flash; flash = null; return `<div class="msg ${f.kind}">${esc(f.text)}</div>`; }
async function run(fn, okText) {
  try { await fn(); if (okText) msg('ok', okText); } catch (e) { msg('err', e.message); }
  render();
}

function render() {
  restoreSession();
  $('#who').innerHTML = session ? `${esc(session.nombre)} · ${esc(session.rol)} · <a href="#" id="out" style="color:#fff">Cerrar sesión</a>` : '';
  if (session) $('#out').onclick = e => { e.preventDefault(); logout(); };
  if (!session) return renderAuth();
  const tabs = session.rol === A
    ? [['torneos', 'Torneos'], ['crear', 'Crear torneo'], ['evento', 'Registrar evento'], ['creditos', 'Asignar créditos'], ['saldo', 'Mi saldo']]
    : [['torneos', 'Torneos'], ['saldo', 'Mi saldo']];
  if (!tab || !tabs.some(t => t[0] === tab)) tab = 'torneos';
  $('#app').innerHTML = `<nav>${tabs.map(t => `<button data-t="${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]}</button>`).join('')}</nav><div id="view"></div>`;
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; flash = null; render(); });
  ({ torneos: vTorneos, crear: vCrear, evento: vEvento, creditos: vCreditos, saldo: vSaldo })[tab]();
}

/* ---- Registro e inicio de sesión (HU01 y HU02) ---- */
function renderAuth() {
  const reg = authMode === 'registro';
  $('#app').innerHTML = `<div class="card" style="max-width:440px;margin:30px auto">
    <h2>${reg ? 'Crear cuenta' : 'Iniciar sesión'}</h2>
    <form id="f" autocomplete="off">
      ${reg ? '<label>Nombre completo</label><input id="n" required><label>Correo</label><input id="c" type="email" required>' : ''}
      <label>Identificación</label><input id="i" required>
      <label>Contraseña</label><input id="p" type="password" required>
      <button class="p" id="go">${reg ? 'Registrarme' : 'Entrar'}</button>
    </form>${showFlash()}
    <p class="note" style="margin-top:14px"><a href="#" id="sw">${reg ? 'Ya tengo cuenta: iniciar sesión' : 'No tengo cuenta: registrarme'}</a></p>
    <p class="note">Administrador de prueba: <b>admin</b> / <b>admin123</b>. Los créditos son virtuales, sin valor monetario.</p></div>`;
  $('#sw').onclick = e => { e.preventDefault(); authMode = reg ? 'login' : 'registro'; flash = null; render(); };
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#go').disabled = true;                // evita el doble clic
    if (reg) { try { await registrar($('#n').value, $('#i').value, $('#c').value, $('#p').value); authMode = 'login'; msg('ok', 'Registro exitoso. Ahora inicia sesión.'); } catch (x) { msg('err', x.message); } render(); }
    else { try { await login($('#i').value, $('#p').value); tab = null; flash = null; } catch (x) { msg('err', x.message); } render(); }
  };
}

/* ---- Torneos y eventos (HU05 y HU06) ---- */
function vTorneos() {
  let h = '';
  try {
    const ts = torneosActivos();
    if (torneoSel) {
      const t = db.torneos.find(x => x.id === torneoSel), evs = eventosDe(torneoSel);
      h = `<div class="card"><button class="s" id="back">← Volver a torneos</button>
        <h2 style="margin-top:12px">${esc(t.nombre)} <span class="note">· ${esc(t.deporte)} · ${t.inicio} a ${t.fin}</span></h2>
        ${evs.length ? `<table><tr><th>Evento</th><th>Inicio</th><th>Cierre de pronósticos</th><th>Opciones</th><th>Estado</th></tr>${evs.map(ev => {
          const est = estadoEvento(ev);
          return `<tr><td>${esc(ev.nombre)}</td><td>${fmt(ev.inicio)}</td><td>${fmt(ev.cierre)}</td><td>${ev.opciones.map(esc).join(', ')}</td><td><span class="badge ${est === 'Programado' ? 'b-open' : 'b-closed'}">${est}</span></td></tr>`;
        }).join('')}</table>` : '<p>Este torneo todavía no tiene eventos.</p>'}</div>`;
    } else {
      h = `<div class="card"><h2>Torneos disponibles</h2>${ts.length ? `<table><tr><th>Torneo</th><th>Deporte</th><th>Inicio</th><th>Fin</th><th></th></tr>${ts.map(t =>
        `<tr><td>${esc(t.nombre)}</td><td>${esc(t.deporte)}</td><td>${t.inicio}</td><td>${t.fin}</td><td><button class="s" data-id="${t.id}">Ver eventos</button></td></tr>`).join('')}</table>`
        : '<p>No hay torneos disponibles.</p>'}</div>`;
    }
  } catch (e) { h = `<div class="msg err">${esc(e.message)}</div>`; }
  $('#view').innerHTML = showFlash() + h;
  document.querySelectorAll('#view [data-id]').forEach(b => b.onclick = () => { torneoSel = Number(b.dataset.id); render(); });
  if ($('#back')) $('#back').onclick = () => { torneoSel = null; render(); };
}

/* ---- Crear torneo (HU03) ---- */
function vCrear() {
  $('#view').innerHTML = `<div class="card" style="max-width:520px"><h2>Crear torneo</h2><form id="f">
    <label>Nombre</label><input id="n" required><label>Deporte</label><input id="d" required>
    <div class="grid2"><div><label>Fecha de inicio</label><input id="a" type="date" required></div><div><label>Fecha de fin</label><input id="b" type="date" required></div></div>
    <button class="p">Guardar torneo</button></form>${showFlash()}</div>`;
  $('#f').onsubmit = e => { e.preventDefault(); run(() => crearTorneo($('#n').value, $('#d').value, $('#a').value, $('#b').value), 'Torneo creado con estado Activo.'); };
}

/* ---- Registrar evento (HU04) ---- */
function vEvento() {
  const ts = db.torneos;
  $('#view').innerHTML = `<div class="card" style="max-width:560px"><h2>Registrar evento</h2>${ts.length ? `<form id="f">
    <label>Torneo</label><select id="t">${ts.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select>
    <label>Nombre del evento</label><input id="n" required>
    <div class="grid2"><div><label>Inicio del evento</label><input id="a" type="datetime-local" required></div><div><label>Cierre de pronósticos</label><input id="b" type="datetime-local" required></div></div>
    <label>Modalidad</label><select id="m"><option value="resultado">Resultado (local, empate, visitante)</option><option value="ganador">Ganador (elegir un participante)</option></select>
    <div id="pw" style="display:none"><label>Participantes (uno por línea)</label><textarea id="pp" rows="4"></textarea></div>
    <button class="p">Guardar evento</button></form>` : '<p>Primero crea un torneo.</p>'}${showFlash()}</div>`;
  if (ts.length) {
    $('#m').onchange = () => $('#pw').style.display = $('#m').value === 'ganador' ? '' : 'none';
    $('#f').onsubmit = e => { e.preventDefault(); run(() => registrarEvento($('#t').value, $('#n').value, $('#a').value, $('#b').value, $('#m').value, $('#pp').value), 'Evento registrado con estado Programado.'); };
  }
}

/* ---- Asignar créditos (HU07) ---- */
function vCreditos() {
  const us = db.usuarios.filter(u => u.rol === U);
  $('#view').innerHTML = `<div class="card" style="max-width:520px"><h2>Asignar créditos iniciales</h2>${us.length ? `<form id="f">
    <label>Usuario</label><select id="u">${us.map(u => `<option value="${u.id}">${esc(u.nombre)} (${esc(u.identificacion)}) · saldo ${saldoDe(u.id)}</option>`).join('')}</select>
    <label>Cantidad de créditos</label><input id="q" type="number" min="1" step="1" required>
    <button class="p" id="go">Asignar</button></form>
    <p class="note">Los créditos son virtuales: no tienen valor monetario ni se pueden retirar.</p>` : '<p>Todavía no hay usuarios registrados.</p>'}${showFlash()}</div>
    <div class="card"><h3>Últimos movimientos</h3>${tablaMov(db.movimientos.slice(-8).reverse(), true)}</div>`;
  if (us.length) $('#f').onsubmit = e => { e.preventDefault(); $('#go').disabled = true;
    const rid = requestId; requestId = nuevoRequestId();
    run(() => asignarCreditos($('#u').value, $('#q').value, rid), 'Créditos asignados y movimiento registrado.'); };
}
function tablaMov(ms, conUsuario) {
  if (!ms.length) return '<p>No hay movimientos.</p>';
  return `<table><tr><th>Fecha</th>${conUsuario ? '<th>Usuario</th>' : ''}<th>Tipo</th><th>Créditos</th><th>Responsable</th></tr>${ms.map(m => {
    const u = db.usuarios.find(x => x.id === m.usuarioId);
    return `<tr><td>${fmt(m.fecha)}</td>${conUsuario ? `<td>${esc(u ? u.nombre : '')}</td>` : ''}<td>${esc(m.tipo)}</td><td>${m.cantidad}</td><td>${esc(m.responsable)}</td></tr>`;
  }).join('')}</table>`;
}

/* ---- Mi saldo (HU08) ---- */
function vSaldo() {
  let h;
  try {
    h = `<div class="card"><h2>Mi saldo</h2><div class="saldo">${miSaldo()} créditos</div>
      <p class="note">Créditos virtuales: sin valor monetario ni posibilidad de retiro. El saldo es la suma de tus movimientos registrados.</p></div>
      <div class="card"><h3>Mis movimientos</h3>${tablaMov(misMovimientos(), false)}</div>`;
  } catch (e) { h = `<div class="msg err">${esc(e.message)}</div>`; }
  $('#view').innerHTML = h;
}

/* ============================ Arranque ============================== */
(async function boot() {
  if (!db) {
    db = { usuarios: [], torneos: [], eventos: [], movimientos: [], requests: [], sig: { usuario: 1, torneo: 1, evento: 1, mov: 1 } };
    db.usuarios.push({ id: db.sig.usuario++, nombre: 'Administrador', identificacion: 'admin', correo: 'admin@matchpoint.com', pass: await sha('admin123'), rol: A });
    saveDB();
  }
  render();
})();
</script>
</body>
</html>
